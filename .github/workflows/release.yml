name: Package release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: corepack enable
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.94.1
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm run licenses
      - run: pnpm audit --prod --audit-level high
      - name: Rust advisory audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm desktop:build --bundles ${{ matrix.bundles }}
      - run: pnpm release:checksums
      - uses: actions/upload-artifact@v6
        with:
          name: nexa-office-${{ matrix.os }}-x86_64
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/SHA256SUMS
            THIRD_PARTY_LICENSES.md
            THIRD_PARTY_NOTICES.txt
            docs/compatibility/office.md
          if-no-files-found: error
      # Updater publication stays disabled until a real verification public key
      # and HTTPS release channel are configured. No private keys in the repo.
