[workspace]
resolver = "2"
members = ["crates/document-model", "crates/nexafile", "crates/office-io", "crates/native-services", "apps/desktop/src-tauri"]
default-members = ["crates/document-model", "crates/nexafile", "crates/office-io", "crates/native-services"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
roxmltree = "0.21"
tempfile = "3"
tracing = "0.1"
document-model = { path = "crates/document-model" }
nexafile = { path = "crates/nexafile" }
office-io = { path = "crates/office-io" }
native-services = { path = "crates/native-services" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 8

[profile.dev]
debug = 0
